security:
    password_hashers:
        Symfony\Component\Security\Core\User\PasswordAuthenticatedUserInterface: 'auto'

    # Les utilisateurs sont chargés depuis la table "utilisateur" (identifiant = email)
    providers:
        app_user_provider:
            entity:
                class: App\Entity\Utilisateur
                property: email

    role_hierarchy:
        ROLE_ADMIN: [ROLE_USER]
        ROLE_SOCIETE: [ROLE_USER]

    firewalls:
        dev:
            pattern: ^/(_(profiler|wdt)|css|images|Images|Video|js|uploads)/
            security: false
        main:
            lazy: true
            provider: app_user_provider
            # Connexion "Personne" (email) ou "Société" (code société) : voir App\Security\LoginAuthenticator
            custom_authenticator: App\Security\LoginAuthenticator
            entry_point: App\Security\LoginAuthenticator
            logout:
                path: app_logout
                target: app_home_no
            remember_me:
                secret: '%kernel.secret%'
                lifetime: 1209600 # 2 semaines
                path: /
                remember_me_parameter: _remember_me

    # Seule la première règle qui correspond est appliquée
    access_control:
        - { path: ^/Equipe_PeasantGo, roles: ROLE_ADMIN }
        - { path: ^/(robot/zones|api/robot/zones), roles: ROLE_ADMIN }
        - { path: ^/api/admin, roles: ROLE_ADMIN }
        - { path: ^/api/(register|password|robot/visiteur|robot/classement|formateur$), roles: PUBLIC_ACCESS }
        - { path: ^/api, roles: ROLE_USER }
        - { path: ^/(home/user|formation/user|espace-formateur|profil|parametres|rejoingner|mes-terrains), roles: ROLE_USER }

when@test:
    security:
        password_hashers:
            Symfony\Component\Security\Core\User\PasswordAuthenticatedUserInterface:
                algorithm: auto
                cost: 4
                time_cost: 3
                memory_cost: 10
