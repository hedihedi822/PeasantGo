name: CI
on:
  push:
  pull_request:
permissions:
  contents: read

env:
  APP_ENV: test
  APP_SECRET: ci-not-a-secret
  DATABASE_URL: "sqlite:///%kernel.project_dir%/var/ci.db"

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: "8.3"
          extensions: intl, pdo_mysql, zip
          tools: composer:v2
      - run: composer install --no-interaction --prefer-dist --no-progress
      - run: composer audit
      - run: find src -name '*.php' -print0 | xargs -0 -n1 php -l > /dev/null
      - run: php bin/console lint:yaml config --parse-tags
      - run: php bin/console lint:twig templates
      - run: php bin/console lint:container

  secrets-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t peasantgo:ci .
