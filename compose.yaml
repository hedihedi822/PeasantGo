services:
  app:
    build: .
    ports:
      - "8080:80"
    environment:
      APP_ENV: ${APP_ENV:-prod}
      APP_SECRET: ${APP_SECRET:?Définir APP_SECRET}
      DATABASE_URL: mysql://app:${DB_PASSWORD:?Définir DB_PASSWORD}@database:3306/peasantgo?serverVersion=8.0&charset=utf8mb4
      MAILER_DSN: smtp://mailer:1025
    depends_on:
      database:
        condition: service_healthy

  database:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: peasantgo
      MYSQL_USER: app
      MYSQL_PASSWORD: ${DB_PASSWORD:?Définir DB_PASSWORD}
      MYSQL_RANDOM_ROOT_PASSWORD: "yes"
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1"]
      interval: 5s
      timeout: 5s
      retries: 20
    volumes:
      - database_data:/var/lib/mysql

  mailer:
    image: axllent/mailpit
    ports:
      - "8025:8025"

volumes:
  database_data:
